# Configuration de test des maquettes : jeu tests/donnees/ifc/ (généré par generer_ifc.py).
dossier_ifc: "tests/donnees/ifc"
dossier_cache: "cache/ifc_test"      # remplacé par un dossier temporaire pendant les tests

traitement:
  exclure: ["IfcSpace", "IfcOpeningElement", "IfcAnnotation", "IfcGrid", "IfcVirtualElement"]
  petits_elements_m: 0.30
  simplification_3d_m: 0.005        # écart maximal toléré en simplifiant les surfaces (5 mm : invisible)
  simplification_emprise_m: 0.05
  simplification_emprise_affichage_m: 0.5   # emprise dessinée sur la carte : morceaux proches fusionnés
  delai_max_minutes: 5
  traitements_simultanes: 2

affichage_3d:
  chargement_automatique_max_mo: 25
  zoom_chargement_automatique: 15      # les maquettes légères se chargent quand elles sont à l'écran à partir de ce zoom
  zoom_details: 18
  budget_triangles_millions: 6         # 3D chargée automatiquement (triangles, petits éléments compris) ;
                                       # au-delà, à la demande. 6 M : fluide sur une carte graphique intégrée
  zoom_emprises: 13                    # en deçà, les maquettes sont des points regroupés ; au-delà, leurs emprises
  max_emprises: 600                    # emprises dessinées au plus (les plus proches du centre de la vue)

# Liste des maquettes (des milliers) : tenue à jour par différence ; le dossier n'est entièrement reparcouru
# (nouvelles maquettes, fichiers modifiés) qu'à cet intervalle, ou par le bouton « Actualiser ».
inventaire:
  balayage_secondes: 30

identification:
  systemes_candidats: ["EPSG:2154", "EPSG:3949"]
  tolerance_m: 2000
  emprise_plausible_wgs84: [1.40, 48.10, 3.60, 49.30]
  # Objets plus loin que cela de l'origine du site : ils portent leurs propres coordonnées (projetées) ;
  # RefLatitude/RefLongitude ne sont alors pas utilisées seules (sinon la maquette serait déplacée de centaines de km)
  ecart_max_geometrie_m: 20000

altimetrie:
  url: "https://altimetrie.test/elevation.json"   # faux service des tests
  ressource: "ign_rge_alti_wld"
  ecart_max_terrain_m: 80

systemes_declares: []

maquettes:
  - fichier: "methode3_manuelle.ifc"
    x: 650000.0
    y: 6860000.0
    altitude: 90.0
    rotation_deg: 30
    decalage_vertical_m: 1.5

# Familles d'objets (filtres de la vue 3D : afficher, masquer, colorer, isoler). Un objet appartient à la première
# famille dont le domaine SGP (Pset SGP_DI_Domaine) correspond ; sinon à la première dont le type IFC correspond ;
# sinon à la première dont le fichier correspond (motif relatif à dossier_ifc : lots de génie civil, par exemple).
# Les propriétés SGP_DI_Domaine sont absentes de 90 % des objets constatés : le type IFC est le critère principal.
familles_objets:
  - nom: "Génie civil"
    couleur: "#d9822b"
    domaines_sgp: ["INF", "SOS"]
    types_ifc: ["IfcWall", "IfcWallStandardCase", "IfcSlab", "IfcBeam", "IfcColumn", "IfcFooting", "IfcPile",
                "IfcRamp", "IfcRampFlight", "IfcStair", "IfcStairFlight", "IfcRoof", "IfcCivilElement",
                "IfcReinforcingBar", "IfcReinforcingMesh", "IfcTendon"]
    fichiers: ["*IGC*", "*Genie_Civil*", "*Genie Civil*", "*Génie*Civil*", "*_GC_*"]
  - nom: "Réseaux et équipements"
    couleur: "#2a9d8f"
    domaines_sgp: ["SYS"]
    types_ifc: ["IfcFlowSegment", "IfcFlowFitting", "IfcFlowTerminal", "IfcFlowController", "IfcFlowMovingDevice",
                "IfcFlowStorageDevice", "IfcFlowTreatmentDevice", "IfcEnergyConversionDevice",
                "IfcDistributionElement", "IfcDistributionControlElement", "IfcDistributionFlowElement",
                "IfcTransportElement", "IfcCableCarrierSegment", "IfcCableCarrierFitting", "IfcCableSegment",
                "IfcPipeSegment", "IfcPipeFitting", "IfcDuctSegment", "IfcDuctFitting"]
  - nom: "Second œuvre"
    couleur: "#8d6cab"
    domaines_sgp: ["INT", "MOB_Mobiliers"]
    types_ifc: ["IfcDoor", "IfcWindow", "IfcCovering", "IfcRailing", "IfcCurtainWall", "IfcFurnishingElement",
                "IfcFurniture"]
