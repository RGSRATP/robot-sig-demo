    url: "https://data.geopf.fr/wfs/ows"
    couche: "ADMINEXPRESS-COG.LATEST:commune"
    emprise_wgs84: [1.44, 48.12, 3.56, 49.24]
    cache_heures: 168
    attribution: "IGN ADMIN EXPRESS"
    visible: false
  - libelle: "IRIS (INSEE, IGN)"   # catalogue n° 29
    url: "https://data.geopf.fr/wfs/ows"
    couche: "STATISTICALUNITS.IRIS:contours_iris"
