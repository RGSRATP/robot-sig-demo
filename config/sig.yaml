# Configuration du module SIG — aucun de ces paramètres ne doit être en dur dans le code.

# Nom et sous-titre affichés dans le bandeau et l'onglet du navigateur
application:
  nom: "Synergie-SIG-BDM-POC"
  sous_titre: "Carte, couches SIG et maquettes BIM"

carte:
  centre_wgs84: [2.35, 48.85]   # Île-de-France
  zoom_initial: 10
  zoom_max: 24                  # maximum de MapLibre : la caméra s'approche à ~4 m du point visé (22 : ~17 m)
  champ_vision_deg: 50          # angle vertical de la caméra ; plus large = caméra plus proche (MapLibre : 36,87)
  systeme_donnees_attendu: "EPSG:2154"
  # Police des étiquettes (codes des locaux) : glyphes de la Géoplateforme, appelés par le navigateur
  glyphes: "https://data.geopf.fr/annexes/ressources/vectorTiles/fonts/{fontstack}/{range}.pbf"
  police: "Source Sans Pro Regular"
  hauteur_coupe_plan_m: 1.5   # plan des locaux : coupe au-dessus du plancher du niveau (convention des plans)

fonds_ign:   # Géoplateforme IGN, WMTS — URL à vérifier au lot 0
  defaut: plan
  plan:
    libelle: "Plan IGN v2"
    url: "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}"
    attribution: "© IGN Géoplateforme"
  ortho:
    libelle: "Orthophotos"
    url: "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/jpeg&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}"
    attribution: "© IGN Géoplateforme"

# Relief (lot 5) : modèles numériques de terrain de la Géoplateforme, appelés par le navigateur.
# Service WMS (le WMTS d'altitude n'existe qu'en coordonnées géographiques) : altitudes NGF en flottants 32 bits
# (image/x-bil;bits=32), une requête par tuile Web Mercator ({bbox-epsg-3857} remplacé par la carte).
# Section absente : pas de relief. Les maquettes sont alors posées sur la carte plate (hauteur par rapport au terrain).
relief:
  actif: false              # relief affiché à l'ouverture
  ombrage: true             # ombrage calculé sur le relief (désactivable dans l'interface)
  zoom_max: 15              # tuiles d'altitude demandées jusqu'à ce zoom, agrandies au-delà (z15 : ~4,8 m par pixel)
  valeur_absente_sous: -1000   # altitude en dessous de laquelle le pixel est « sans donnée » (IGN : -99999, LiDAR : -9999)
  defaut: rgealti
  sources:
    rgealti:
      libelle: "RGE ALTI (IGN, toute la France)"
      url: "https://data.geopf.fr/wms-r/wms?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=ELEVATION.ELEVATIONGRIDCOVERAGE.HIGHRES&STYLES=&CRS=EPSG:3857&BBOX={bbox-epsg-3857}&WIDTH=256&HEIGHT=256&FORMAT=image/x-bil;bits=32"
      attribution: "© IGN RGE ALTI"
    lidarhd:
      libelle: "LiDAR HD (IGN, plus fin, partiel)"
      url: "https://data.geopf.fr/wms-r/wms?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=IGNF_LIDAR-HD_MNT_ELEVATION.ELEVATIONGRIDCOVERAGE.LAMB93&STYLES=&CRS=EPSG:3857&BBOX={bbox-epsg-3857}&WIDTH=256&HEIGHT=256&FORMAT=image/x-bil;bits=32"
      attribution: "© IGN LiDAR HD"
      secours: rgealti      # pixels sans donnée complétés par cette source

# Bâtiments 3D (lot 5) : BD TOPO de l'IGN en tuiles vectorielles, appelées par le navigateur, extrudées à leur
# hauteur. Section absente : pas de bâtiments 3D.
batiments:
  libelle: "Bâtiments 3D (BD TOPO, IGN)"
  url: "https://data.geopf.fr/tms/1.0.0/BDTOPO/{z}/{x}/{y}.pbf"
  couche_source: "batiment"          # couche des tuiles
  attribution: "© IGN BD TOPO"
  zoom_min: 15                       # les tuiles ne contiennent les bâtiments qu'à partir du zoom 15
  zoom_max_tuiles: 18                # tuiles demandées jusqu'à ce zoom, agrandies au-delà
  visible: false                     # affichés à l'ouverture
  opacite: 0.85
  champ_identifiant: "cleabs"        # identifiant unique (sélection, masquage)
  champ_hauteur: "hauteur"           # mètres
  hauteur_defaut_m: 3                # hauteur inconnue
  masquer_sous_maquettes: true       # bâtiments sous une maquette affichée en 3D masqués (gares reconstruites…)
  champ_couleur: "usage_1"
  couleurs:
    "Résidentiel": "#d8c9b0"
    "Commercial et services": "#d0a77c"
    "Industriel": "#a9adbd"
    "Agricole": "#b8c79a"
    "Religieux": "#c5a3c9"
    "Sportif": "#97c3c8"
    "Annexe": "#d9d9d9"
  couleur_defaut: "#cdc6ba"          # « Indifférencié » et usages non listés
  # attributs affichés en tête de fiche (les autres suivent dans le tableau)
  champs_fiche: ["nature", "usage_1", "usage_2", "hauteur", "nombre_d_etages", "nombre_de_logements",
                 "date_d_apparition", "materiaux_des_murs", "materiaux_de_la_toiture", "etat_de_l_objet", "identifiants_rnb"]

# Nuage de points LiDAR HD (lot 5) : dalles de 1 km² de l'IGN au format COPC (LAZ « cloud optimized »), listées par
# le service WFS de la Géoplateforme et lues par morceaux par le navigateur (seuls les niveaux de détail utiles).
# Coordonnées Lambert 93, altitudes IGN69 (NGF). Section absente : pas de nuage de points.
lidar:
  # {sud}, {ouest}, {nord}, {est} : emprise affichée en degrés (WGS84)
  wfs_dalles: "https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=IGNF_LIDAR-HD_METADONNEE:metadata&OUTPUTFORMAT=application/json&SRSNAME=EPSG:4326&PROPERTYNAME=url_npl,nombre_points,date_fin_acquisition,geom&COUNT=50&BBOX={sud},{ouest},{nord},{est},urn:ogc:def:crs:EPSG::4326"
  champ_url: "url_npl"             # lien de la dalle COPC
  champ_date: "date_fin_acquisition"
  systeme: "EPSG:2154"             # système attendu des points ; une dalle déclarant un autre système est ignorée et signalée
  attribution: "© IGN LiDAR HD"
  zoom_min: 16                     # en dessous, le nuage n'est pas chargé
  max_dalles: 4                    # dalles chargées en même temps (les plus proches du centre)
  budget_points: 2000000           # points affichés au plus (toutes dalles) ; le serveur IGN limite les lectures
                                   # (~1 par seconde, ~60 000 points chacune) : plus de points = chargement plus long
  taille_point_px: 2
  couleur: "classe"                # classe | altitude | rgb (couleurs réelles, si la dalle en a)
  classes:                         # classification du LiDAR HD (IGN)
    1: { libelle: "Non classé", couleur: "#b8b8b8", visible: false }
    2: { libelle: "Sol", couleur: "#a8875c" }
    3: { libelle: "Végétation basse", couleur: "#c6e08f" }
    4: { libelle: "Végétation moyenne", couleur: "#79b85a" }
    5: { libelle: "Végétation haute", couleur: "#2f7d32" }
    6: { libelle: "Bâtiment", couleur: "#d0604f" }
    9: { libelle: "Eau", couleur: "#3d8fd6" }
    17: { libelle: "Pont", couleur: "#e3a33b" }
    64: { libelle: "Sursol pérenne", couleur: "#9a62b5" }
    65: { libelle: "Artefacts", couleur: "#dddddd", visible: false }
    66: { libelle: "Points virtuels", couleur: "#7a7a7a", visible: false }
    67: { libelle: "Divers - bâtis", couleur: "#c98a7a" }
  couleur_autres_classes: "#999999"

# Données en temps réel (lot 5) : interrogées par le serveur à travers le proxy (section « reseau »), gardées en
# mémoire pendant « periode_s », puis relues à la demande de l'interface. Une source injoignable garde sa dernière
# réponse, datée, avec un message. Types : gbfs (vélos en libre-service), hubeau_hydrometrie (hauteurs d'eau),
# open_meteo (météo actuelle sur une grille), idfm_prochains_passages (PRIM, clé dans .env via « jeton_env »),
# vigicrues_vigilance (vigilance crues par tronçon de cours d'eau).
temps_reel:
  - id: velib
    type: gbfs
    libelle: "Vélib' Métropole : vélos disponibles"
    url_stations: "https://velib-metropole-opendata.smovengo.cloud/opendata/Velib_Metropole/station_information.json"
    url_etat: "https://velib-metropole-opendata.smovengo.cloud/opendata/Velib_Metropole/station_status.json"
    periode_s: 60
    attribution: "Vélib' Métropole (ODbL)"
  - id: hubeau
    type: hubeau_hydrometrie
    libelle: "Hauteur des cours d'eau (Hub'Eau)"
    url: "https://hubeau.eaufrance.fr/api/v2/hydrometrie"
    emprise_wgs84: [1.4, 48.1, 3.6, 49.3]   # ouest, sud, est, nord
    heures: 3                               # observations des dernières heures (la plus récente par station)
    periode_s: 600
    attribution: "Hub'Eau, Vigicrues / SCHAPI (Licence Ouverte)"
  - id: meteo
    type: open_meteo
    libelle: "Météo actuelle (Open-Meteo)"
    url: "https://api.open-meteo.com/v1/forecast"
    emprise_wgs84: [1.6, 48.2, 3.4, 49.2]
    pas_deg: 0.2                            # grille de points (environ 15 km)
    periode_s: 900
    attribution: "Open-Meteo (CC BY 4.0, usage non commercial gratuit)"
  - id: idfm
    type: idfm_prochains_passages
    libelle: "Prochains passages en gare (IDFM)"
    url: "https://prim.iledefrance-mobilites.fr/marketplace/stop-monitoring"
    url_zones: "https://data.iledefrance-mobilites.fr/api/explore/v2.1/catalog/datasets/zones-d-arrets/records"
    url_lignes: "https://data.iledefrance-mobilites.fr/api/explore/v2.1/catalog/datasets/referentiel-des-lignes/records"
    jeton_env: "IDFM_PRIM_CLE"              # NOM de la variable du fichier .env (jamais la clé elle-même)
    zones_arret: ["58774", "45102", "470549", "58270"]   # Massy-Palaiseau, Châtelet-Les Halles, La Défense, Champigny (RER A)
    horizon_min: 60                         # passages affichés dans l'heure
    periode_s: 60
    attribution: "Île-de-France Mobilités (PRIM)"
  - id: vigicrues
    type: vigicrues_vigilance
    libelle: "Vigilance crues par tronçon (Vigicrues)"
    url: "https://www.vigicrues.gouv.fr/services/1/InfoVigiCru.geojson"
    emprise_wgs84: [1.4, 48.1, 3.6, 49.3]   # tronçons qui recoupent cette emprise (ouest, sud, est, nord)
    simplification_deg: 0.0005              # tracé simplifié (~50 m) : le fichier national pèse 2 Mo
    periode_s: 900
    visible: true
    attribution: "Vigicrues (SCHAPI)"

# Contexte d'une maquette (lot 5, croisements) : risques (Géorisques), bâti environnant (BDNB), niveau du cours
# d'eau le plus proche (Hub'Eau), interrogés par le serveur à la demande (bouton de la fiche), gardés en cache.
contexte:
  dossier_cache: "cache/contexte"
  cache_heures: 24
  georisques: "https://georisques.gouv.fr/api/v1"
  rayon_m: 500                       # installations classées, sites pollués, cavités, mouvements de terrain
  rayon_inondation_m: 1000           # atlas des zones inondables
  bdnb: "https://api.bdnb.io/v1/bdnb/donnees/batiment_groupe_complet/bbox"
  tampon_bati_m: 30                  # bande autour de l'emprise : bâti au-dessus ou au bord de l'ouvrage
  annee_bati_ancien: 1948            # construit avant : « bâti ancien » (fondations superficielles, maçonnerie)
  max_batiments: 1500                # bâtiments lus au plus (la BDNB répond par pages de 10, ~4 s par 100) : au-delà, liste tronquée (signalé)
  hubeau: "https://hubeau.eaufrance.fr/api/v2/hydrometrie"
  rayon_station_km: 5                # station hydrométrique la plus proche dans ce rayon
  vigicrues: "https://www.vigicrues.gouv.fr/services/station.json/index.php"   # crues historiques des stations de prévision
  max_stations_vigicrues: 4          # stations voisines interrogées au plus pour trouver des crues historiques
  vigicrues_observations: "https://www.vigicrues.gouv.fr/services/observations.json/index.php"   # hauteurs observées (~3 mois)
  vigicrues_previsions: "https://www.vigicrues.gouv.fr/services/previsions.json/index.php"       # publiées en période de crue
  jours_hydrogramme: 30              # durée de la courbe de hauteur d'eau de la fiche
  periode_hydrogramme_s: 600         # courbe gardée en mémoire (secondes)
  source_vigilance: "vigicrues"       # id de la source temps réel de vigilance crues (section temps_reel)
  rayon_vigilance_km: 5              # tronçon en vigilance le plus proche de l'ouvrage, dans ce rayon
  delai_etages_s: 300                # lecture des étages IFC d'une maquette traitée avant leur extraction (une fois, mise en cache)

donnees:
  dossier_sig: "donnees/sig"   # relatif à la racine du projet ; parcouru avec ses sous-dossiers

chargement:
  seuil_objets_filtre_emprise: 20000   # au-delà, chargement limité à l'emprise affichée
  max_resultats_recherche: 50
  marge_controle_systeme_deg: 0.5      # tolérance (degrés) du contrôle « emprise compatible avec le système déclaré »

# Interrogation croisée SIG ↔ maquettes (lot 4)
croisement:
  tampon_m: 0                   # marge autour de l'emprise d'une maquette ou d'un objet SIG
  max_objets_par_couche: 500    # au-delà, la liste d'une couche est tronquée (le total reste indiqué)

# Exports CSV (Excel en français : point-virgule, UTF-8 avec BOM)
export:
  separateur: ";"
  encodage: "utf-8-sig"

# Attribut affiché comme nom d'un objet (recherche, fiche) : premier champ présent de cette liste,
# sauf si la couche déclare « champ_libelle ». Comparaison insensible à la casse.
champs_libelle: ["libelle", "nom", "name", "nom_gares", "intitule", "label", "id"]

# Style par défaut selon la géométrie ; la couleur est prise dans la palette, une par couche.
styles_defaut:
  point:    { rayon: 5, opacite: 0.9, contour: "#ffffff", epaisseur_contour: 1 }
  ligne:    { epaisseur: 2.5, opacite: 0.9 }
  polygone: { opacite: 0.35, epaisseur: 1 }
palette: ["#d9480f", "#1c7ed6", "#2f9e44", "#ae3ec9", "#f08c00", "#0c8599", "#e03131", "#5c940d", "#3b5bdb", "#a61e4d"]
style_selection: { couleur: "#E8B400", rayon: 9, epaisseur: 6 }

# Couches fichiers : détectées automatiquement dans le dossier ci-dessus.
# Déclarer ici uniquement les surcharges et les CSV. « fichier » : chemin relatif au dossier (ou nom seul s'il est unique).
# Clés possibles : couche (couche d'un GeoPackage ; absente = toutes), libelle, style, visible, champ_libelle,
# systeme (déclare le système quand le fichier n'en a pas ou en a un faux ; c'est une déclaration, jamais une supposition),
# et pour les CSV : colonne_x, colonne_y, systeme (obligatoire), separateur (défaut ";"), encodage (défaut "utf-8").
# Exports ArcGIS (Esri JSON, InfraGéo) : le champ d'affichage de l'export (« displayFieldName ») sert de nom
# sans déclaration ; « champ_libelle » ne sert qu'à le remplacer.
couches_fichiers:
#  - fichier: "gares.gpkg"
#    couche: "gares"
#    libelle: "Gares"
#    style: { couleur: "#0a7d3b", epaisseur: 2, rayon: 6, opacite: 0.8 }
#  - fichier: "gpkg/IfcSpaces_XYZ.gpkg"
#    systeme: "EPSG:3949"       # le fichier déclare EPSG:4326 alors que ses coordonnées sont en CC49
#  - fichier: "points_releves.csv"
#    colonne_x: "X"
#    colonne_y: "Y"
#    systeme: "EPSG:2154"
#    separateur: ";"
#    encodage: "utf-8"

# Appels sortants du serveur (services Esri, altimétrie IGN)
reseau:
  proxy: "http://127.0.0.1:9000"     # null : connexion directe (ou variables HTTPS_PROXY du poste)
  certificats: null                  # null : magasin de certificats du poste ; sinon fichier .pem d'autorités
  delai_secondes: 30                  # délai maximal d'une requête

# Services Esri (ArcGIS REST) — interrogés par le serveur, à travers le proxy ci-dessous.
esri:
  dossier_cache: "cache/esri"        # couches téléchargées (GeoPackage + fiche JSON), hors Git
  dossier_exports: "donnees/esri"    # exports de repli quand un service est injoignable
  max_objets: 100000                 # garde-fou par couche (au-delà : couche tronquée, signalée)
  cache_heures_defaut: 24            # durée de validité du cache si le service ne précise pas « cache_heures »
  nouvel_essai_minutes: 10           # après un échec, délai avant de réessayer le service

# Couches de services. Clés : libelle, url (…/FeatureServer/<n> ou …/MapServer/<n>) ; facultatives :
# where (défaut "1=1"), champs (défaut "*"), cache_heures, taille_page (défaut : maxRecordCount du service),
# max_objets, export (fichier de repli dans esri.dossier_exports) et export_couche (couche d'un GeoPackage),
# jeton_env (NOM de la variable de .env qui contient le jeton ; jamais le jeton lui-même), systeme
# (seulement si le service n'en déclare pas), style, visible, champ_libelle.
# Services publics de développement (InfraGéo à déclarer quand l'accès sera connu) :
services_esri:
  - libelle: "Gares et stations IDF (service AEV)"
    url: "https://services2.arcgis.com/ruKJb5uCrBl1RGxR/arcgis/rest/services/transport_en_commun_gare/FeatureServer/0"
    champ_libelle: "nomlong"
    cache_heures: 24
  - libelle: "Départements IDF (service AEV)"
    url: "https://services2.arcgis.com/ruKJb5uCrBl1RGxR/arcgis/rest/services/departement_idf/FeatureServer/0"
    champ_libelle: "nomdep"
    style: { couleur: "#495057", opacite: 0.05, epaisseur: 1.5 }
    visible: false
#  - libelle: "Ouvrages InfraGéo"
#    url: "https://<portail>/arcgis/rest/services/<service>/FeatureServer/0"
#    jeton_env: "INFRAGEO_JETON"
#    export: "ouvrages_infrageo.gpkg"
