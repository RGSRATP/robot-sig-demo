# Plans Locaux d'Aide à l'Intervention (PLAI, RATP) : un PDF par station, lu par le serveur (lot 5, 2026-10-15).
# Pictogrammes (point RATP, point de rassemblement, accès pompiers, accès aux quais) rattachés à l'accès du plan
# le plus proche, placés à la position IDFM de cet accès ; écart avec l'endroit dessiné mesuré par calage du plan.
# Clés : libelle, dossier (PDF, lecture seule), couche_gares et couche_acces (libellés des couches IDFM de référence) ;
# facultatives : rayon_m (accès cherchés autour de la station, défaut 400), processus (lecture parallèle, défaut 4),
# cache_heures, style (icones : champ, images, taille, decalages en pixels de l'image), visible.
services_plai:
  - libelle: "Plans d'intervention (PLAI)"
    dossier: "donnees/Plan acces PG"
    couche_gares: "Gares et stations IDF (IDFM)"
    couche_acces: "Accès des gares (IDFM)"
    rayon_m: 400
    cache_heures: 24
    champ_libelle: "libelle_type"
    style:
      couleur: "#0A0082"
      icones:
        champ: "type"
        taille: 0.25                  # pictogrammes découpés à 4× (288 dpi) : ~28 px à l'écran
        images:
          ratp: "/api/sig/plai/icones/ratp.png"
          rassemblement: "/api/sig/plai/icones/rassemblement.png"
          pompiers: "/api/sig/plai/icones/pompiers.png"
          quais: "/api/sig/plai/icones/quais.png"
        decalages:                    # plusieurs pictogrammes au même accès : côte à côte, épingle au-dessus
          ratp: [-120, 0]
          pompiers: [0, 0]
          rassemblement: [120, 0]
          quais: [0, -150]
    visible: false

# Carte de gestion de crise (lot C1, 2026-10-21) : éléments touchés autour d'un événement, zone par zone.
# Distances en Lambert 93 au point de l'événement (point le plus proche d'une ligne ou d'une surface) ; un élément
# appartient à la zone la plus grave qui le contient (ordre de « zones »). L'outil aide à décider, il ne décide pas.
# Catégories : id, libelle, couches (libellés EXACTS des couches) ; facultatives : role (points, stations, acces,
# lignes, plai, maquettes ; défaut points), champ_libelle, regroupement (champ qui réunit plusieurs objets en un
# élément ; « @couche » : un élément par couche), champ_detail, propositions (texte par rôle de zone).
crise:
  dossier_travail: "travail/crise"     # événements enregistrés (hors Git)
  rayon_max_m: 3000                    # objets cherchés jusqu'à cette distance (compteurs en direct)
  rayon_defaut_m: 500                  # simple clic sans glisser
  pas_m: 10                            # arrondi du rayon pendant le glissement (Maj : au mètre)
  raccourcis_m: [500, 600, 1000]
  rattachement_acces_m: 250            # un accès est rattaché à la station la plus proche à moins de cette distance
  types: ["Explosion", "Incendie", "Effondrement", "Fuite de gaz", "Colis suspect", "Inondation", "Accident de voirie", "Autre"]
  avertissement: "Aide à la décision : données ouvertes et PLAI à leur date, à confirmer sur place."
  zones:                               # du plus grave au moins grave
    - { id: evacuation, libelle: "Évacuation", couleur: "#e03131" }
    - { id: fermeture, libelle: "Fermeture / accès interdit", couleur: "#f76707" }
    - { id: vigilance, libelle: "Vigilance / confinement", couleur: "#f2c200" }
  # Statuts des éléments (lot C2) : le premier est le statut par défaut (à décider) ; decide : décision prise
  # (pictogramme plein) ; barre : croix sur la carte (fermé, évacué, interrompu). Une catégorie peut restreindre
  # la liste (clé « statuts » : identifiants) ; sans cette clé, tous les statuts sont proposés.
  statuts:
    - { id: propose, libelle: "À décider", decide: false }
    - { id: ferme, libelle: "Fermé", decide: true, barre: true }
    - { id: sans_arret, libelle: "Sans arrêt", decide: true }
    - { id: interrompu, libelle: "Trafic interrompu", decide: true, barre: true }
    - { id: evacue, libelle: "Évacué", decide: true, barre: true }
    - { id: confine, libelle: "Confiné", decide: true }
    - { id: alerte, libelle: "Alerté / informé", decide: true }
    - { id: surveille, libelle: "À surveiller", decide: true }
    - { id: ouvert, libelle: "Maintenu ouvert", decide: true }
    - { id: leve, libelle: "Levé", decide: true }
  # Sources « autour de l'événement » (lot C3) : couches nationales demandées au WFS par carreaux de Lambert 93
  # (« carreau_m ») qui couvrent le disque de « rayon_m » autour du point, gardées en cache (« cache_heures »).
  # Au-delà de « rayon_m », les résultats sont signalés incomplets. « champs » : attributs demandés (volume réduit).
  dossier_cache: "cache/crise"         # carreaux téléchargés (hors Git)
  requetes_paralleles: 4
  sources_locales:
    - id: rues
      libelle: "Tronçons de route (BD TOPO, IGN)"
      url: "https://data.geopf.fr/wfs/ows"
      couche: "BDTOPO_V3:troncon_de_route"
      # chaussées au sol ou sur pont (souterrains écartés), ni escaliers ni sentiers, pas de tronçons fictifs
      filtre_cql: "fictif = false AND position_par_rapport_au_sol NOT IN ('-1','-2','-3','-4') AND nature NOT IN ('Escalier','Sentier','Bac ou liaison maritime')"
      champs: [nature, importance, nom_collaboratif_gauche, nom_collaboratif_droite, sens_de_circulation]
      rayon_m: 3000
      carreau_m: 1000
      cache_heures: 720
      attribution: "IGN BD TOPO"
    - id: batiments
      libelle: "Bâtiments (BD TOPO, IGN)"
      url: "https://data.geopf.fr/wfs/ows"
      couche: "BDTOPO_V3:batiment"
      champs: [nombre_de_logements, usage_1, hauteur]
      rayon_m: 1500                    # ~550 bâtiments par carreau de 500 m dans Paris
      carreau_m: 500
      cache_heures: 720
      attribution: "IGN BD TOPO"
    - id: population
      libelle: "Population carroyée 200 m (INSEE Filosofi)"
      url: "https://data.geopf.fr/wfs/ows"
      couche: "INSEE.FILOSOFI.INDICATORS:carreaux_200m"
      champ_geometrie: "geom"
      champs: [ind, men, ind_0_3, ind_80p]
      rayon_m: 3000
      carreau_m: 1000
      cache_heures: 2160
      date_donnee: "Filosofi, millésime 2019 probable (non indiqué par le service)"
      attribution: "INSEE, Filosofi (carroyage 200 m), via IGN Géoplateforme"
  categories:
    - id: stations
      libelle: "Stations"
      role: stations
      couches: ["Gares et stations IDF (IDFM)"]
      regroupement: "nom_zdc"          # une station = toutes ses lignes
      champ_detail: "res_com"
      statuts: [propose, ferme, sans_arret, surveille, ouvert, leve]
      propositions: { evacuation: "Fermer la station", fermeture: "Fermer la station (par défaut ; « sans arrêt » possible sur décision)", vigilance: "Surveiller" }
    - id: acces
      libelle: "Accès des stations"
      role: acces
      couches: ["Accès des gares (IDFM)"]
      champ_libelle: "accname"
      statuts: [propose, ferme, surveille, ouvert, leve]
      propositions: { evacuation: "Fermer l'accès", fermeture: "Fermer l'accès", vigilance: "Surveiller" }
    - id: lignes
      libelle: "Lignes (tronçons touchés)"
      role: lignes
      couches: ["Tracés du réseau ferré IDF (IDFM)"]
      regroupement: "res_com"
      statuts: [propose, interrompu, surveille, alerte, ouvert, leve]
      propositions: { evacuation: "Interrompre le trafic sur le tronçon", fermeture: "Interruption ou marche à vue (à décider)", vigilance: "Informer l'exploitation" }
    - id: ouvrages
      libelle: "Ouvrages RATP (maquettes)"
      role: maquettes
      dossiers: { "gare": "Gare", "intergare": "Tunnel (intergare)", "ouvrage annexe": "Ouvrage annexe" }
      puits: ["ouvrage annexe"]
      message_puits: "puits : fumées ou gaz peuvent passer vers le souterrain"
      statuts: [propose, evacue, ferme, surveille, leve]
      propositions: { evacuation: "Évacuer les équipes, ouvrage à sécuriser", fermeture: "Interdire l'accès à l'ouvrage", vigilance: "Surveiller" }
    - id: plai
      libelle: "Points d'intervention (PLAI)"
      role: plai
      couches: ["Plans d'intervention (PLAI)"]
      champ_libelle: "libelle_type"
      champ_detail: "station"
      champ_type: "type"
      type_rassemblement: "rassemblement"
      zones_bloquantes: [evacuation, fermeture]
      statuts: [propose, ferme, surveille, ouvert, leve]
      propositions: { evacuation: "Dans la zone d'évacuation", fermeture: "Dans la zone de fermeture", vigilance: "Utilisable, à surveiller" }
    - id: police
      libelle: "Police (les plus proches)"
      role: secours
      couches: ["Postes de police et gendarmeries (BD TOPO, IGN)"]
      champ_libelle: "toponyme"
      champ_detail: "nature_detaillee"
      nombre: 2                        # sites les plus proches montrés, reliés au point par une ligne
      rayon_recherche_m: 15000         # cherchés plus loin que les autres catégories
      couleur: "#1c3f94"
      statuts: [propose, alerte, leve]
      propositions: { evacuation: "Dans la zone d'évacuation : moyens à replier", fermeture: "Dans la zone de fermeture" }
    - id: pompiers
      libelle: "Pompiers (les plus proches)"
      role: secours
      couches: ["Casernes de pompiers (BD TOPO, IGN)"]
      champ_libelle: "toponyme"
      champ_detail: "nature_detaillee"
      nombre: 2
      rayon_recherche_m: 15000
      couleur: "#d9480f"
      statuts: [propose, alerte, leve]
      propositions: { evacuation: "Dans la zone d'évacuation : moyens à replier", fermeture: "Dans la zone de fermeture" }
    - id: ecoles
      libelle: "Établissements scolaires"
      couches: ["Établissements scolaires (Éducation nationale)"]
      champ_libelle: "nom_etablissement"
      champ_detail: "type_etablissement"
      statuts: [propose, evacue, confine, alerte, surveille, leve]
      propositions: { evacuation: "Évacuer", fermeture: "Évacuer ou confiner (à décider)", vigilance: "Confiner, informer" }
    - id: sante
      libelle: "Hôpitaux et maisons de retraite"
      couches: ["Hôpitaux et maisons de retraite (BD TOPO, IGN)"]
      champ_libelle: "toponyme"
      champ_detail: "nature"
      statuts: [propose, evacue, confine, alerte, surveille, leve]
      propositions: { evacuation: "Évacuer (personnes peu mobiles : moyens à prévoir)", fermeture: "Confiner ou évacuer (à décider)", vigilance: "Confiner, informer" }
    - id: rues
      libelle: "Rues"
      role: rues
      source_locale: rues
      regroupement: [nom_collaboratif_gauche, nom_collaboratif_droite]   # une voie = ses tronçons
      champ_type: "nature"
      libelle_sans_nom: "Voie sans nom"
      statuts: [propose, ferme, surveille, ouvert, leve]
      propositions: { evacuation: "Fermer la voie", fermeture: "Fermer la voie ou restreindre la circulation", vigilance: "Surveiller" }
    - id: bouclage
      libelle: "Points de bouclage"
      role: bouclage
      source_locale: rues
      zones_bouclage: [evacuation, fermeture]   # voies qui coupent la limite extérieure de ces zones
      regroupement: [nom_collaboratif_gauche, nom_collaboratif_droite]
      champ_type: "nature"
      champ_ordre: "importance"        # 1 = voie principale : en tête de liste
      libelle_sans_nom: "Voie sans nom"
      statuts: [propose, ferme, surveille, leve]
      propositions: { evacuation: "Barrer la voie (limite de la zone d'évacuation)", fermeture: "Barrer la voie (limite du périmètre)" }
    - id: batiments
      libelle: "Bâtiments"
      role: denombrement
      source_locale: batiments
      mesures:
        - { id: batiments, libelle: "Bâtiments" }
        - { id: logements, libelle: "Logements", champ: "nombre_de_logements" }
    - id: population
      libelle: "Population estimée"
      role: denombrement
      source_locale: population
      prorata: true                    # carreau coupé par la zone : population au prorata de la surface
      date_donnee: "INSEE Filosofi, carreaux de 200 m (millésime 2019 probable)"
      mesures:
        - { id: habitants, libelle: "Habitants", champ: "ind", arrondi: 10 }
        - { id: menages, libelle: "Ménages", champ: "men", arrondi: 10 }
        - { id: enfants, libelle: "dont enfants de 0 à 3 ans", champ: "ind_0_3", arrondi: 10 }
        - { id: ages, libelle: "dont personnes de 80 ans et plus", champ: "ind_80p", arrondi: 10 }
    - id: gaz
      libelle: "Réseaux de gaz"
      role: lignes
      couches: ["Réseau de transport de gaz (NaTran, ODRÉ)", "Réseau GRDF – Massy"]
      regroupement: "@couche"
      statuts: [propose, alerte, surveille, leve]
      propositions: { evacuation: "Alerter le gestionnaire du réseau", fermeture: "Alerter le gestionnaire du réseau", vigilance: "Informer le gestionnaire" }
    - id: chantiers
      libelle: "Chantiers (Paris)"
      couches: ["Chantiers en cours à Paris"]
      champ_libelle: "chantier_synthese"
      champ_detail: "moa_principal"
      statuts: [propose, evacue, ferme, alerte, surveille, leve]
      propositions: { evacuation: "Arrêter et évacuer le chantier", fermeture: "Arrêter le chantier", vigilance: "Gêne possible pour les secours" }
    - id: travaux
      libelle: "Travaux perturbants (Paris)"
      couches: ["Travaux perturbants (Paris)"]
      champ_libelle: "voie"
      champ_detail: "impact_circulation"
      statuts: [propose, alerte, surveille, leve]
      propositions: { evacuation: "Gêne pour les secours", fermeture: "Gêne pour les secours", vigilance: "Gêne possible pour les secours" }
    - id: defibrillateurs
      libelle: "Défibrillateurs RATP"
      couches: ["Défibrillateurs du réseau RATP"]
      champ_libelle: "adr_voie"
      champ_detail: "acc_complt"
      statuts: [propose, surveille, leve]
      propositions: { vigilance: "Disponible à proximité" }
