    emprise_wgs84: [2.15, 48.72, 2.62, 48.95]
    cache_heures: 168
    attribution: "IGN BD TOPO"
    visible: false
  - libelle: "Cours d'eau (BD TOPO, IGN)"   # catalogue n° 1
