# Services WFS 2.0 (catalogue Open Data, 15/10/2026), interrogés par le serveur. Clés : libelle, url, couche,
# emprise_wgs84 [ouest, sud, est, nord] (obligatoire : services nationaux) ; facultatives : systeme (défaut EPSG:2154),
# format_sortie (défaut application/json ; MapServer : « application/json; subtype=geojson »), tri (SORTBY),
# taille_page (défaut 1000), max_objets, cache_heures, export, attribution, style, visible, champ_libelle.
# Couches denses (parcelles, PLU, servitudes) : déclarées par site (Massy, Champigny), jamais sur toute la région.
