# Maquettes IFC : dossier, traitement, positionnement sur la carte.
# Aucun système n'est jamais supposé : il est lu dans la maquette, identifié, ou déclaré ici.

dossier_ifc: "donnees/ifc"         # relatif à la racine du projet ; parcouru avec ses sous-dossiers
dossier_cache: "cache/ifc"         # modèles 3D (GLB), emprises et index des propriétés, hors Git

# La 3D est convertie par web-ifc (commun/ifc/convertisseur) en modèles allégés ; IfcOpenShell lit en parallèle
# les propriétés et les locaux.
traitement:
  exclure: ["IfcSpace", "IfcOpeningElement", "IfcAnnotation", "IfcGrid", "IfcVirtualElement"]
  petits_elements_m: 0.30          # pièces plus petites (plus grande dimension) : modèle « détail », vue rapprochée
  simplification_3d_m: 0.005        # écart maximal toléré en simplifiant les surfaces (5 mm : invisible)
  simplification_emprise_m: 0.05   # tolérance de simplification de l'emprise au sol
  simplification_emprise_affichage_m: 0.5   # emprise dessinée sur la carte : morceaux proches fusionnés
  delai_max_minutes: 15            # au-delà, le traitement d'une maquette est interrompu et signalé
  traitements_simultanes: 2        # maquettes traitées en même temps (mémoire : jusqu'à 3 Go par grosse maquette)

affichage_3d:
  chargement_automatique_max_mo: 25   # modèles 3D plus lourds : chargés à la demande (bouton)
  zoom_chargement_automatique: 15      # les maquettes légères se chargent quand elles sont à l'écran à partir de ce zoom
  zoom_details: 18                     # petits éléments affichés à partir de ce zoom
  budget_triangles_millions: 6         # 3D chargée automatiquement (triangles, petits éléments compris) ;
                                       # au-delà, à la demande. 6 M : fluide sur une carte graphique intégrée
  zoom_emprises: 13                    # en deçà, les maquettes sont des points regroupés ; au-delà, leurs emprises
  max_emprises: 600                    # emprises dessinées au plus (les plus proches du centre de la vue)

# Liste des maquettes (des milliers) : tenue à jour par différence ; le dossier n'est entièrement reparcouru
# (nouvelles maquettes, fichiers modifiés) qu'à cet intervalle, ou par le bouton « Actualiser ».
inventaire:
  balayage_secondes: 30

# Identification du système des coordonnées projetées portées par l'IfcSite (coordonnées partagées) :
# le système candidat retenu est celui où RefLatitude/RefLongitude tombent à moins de « tolerance_m » du site.
identification:
  systemes_candidats: ["EPSG:2154", "EPSG:3942", "EPSG:3943", "EPSG:3944", "EPSG:3945", "EPSG:3946",
                       "EPSG:3947", "EPSG:3948", "EPSG:3949", "EPSG:3950"]
  tolerance_m: 2000
  # RefLatitude/RefLongitude hors de cette emprise (ouest, sud, est, nord) : valeur par défaut du logiciel, ignorées
  emprise_plausible_wgs84: [1.40, 48.10, 3.60, 49.30]
  # Objets plus loin que cela de l'origine du site : ils portent leurs propres coordonnées (projetées) ;
  # RefLatitude/RefLongitude ne sont alors pas utilisées seules (sinon la maquette serait déplacée de centaines de km)
  ecart_max_geometrie_m: 20000

# Calage vertical : les maquettes sont posées par rapport au terrain (RGE ALTI de l'IGN, interrogé par le serveur).
altimetrie:
  url: "https://data.geopf.fr/altimetrie/1.0/calcul/alti/rest/elevation.json"
  ressource: "ign_rge_alti_wld"
  ecart_max_terrain_m: 80          # au-delà, l'altitude de la maquette est jugée incohérente avec le terrain

# Déclarations explicites du système des coordonnées projetées du site, par dossier (motif relatif à dossier_ifc).
# Une déclaration ne remplace pas un système identifié dans la maquette ; elle sert quand RefLatitude/RefLongitude
# sont absentes ou fausses (valeur par défaut de Revit : Boston, Paris…).
systemes_declares:
  - motif: "L18/**"
    systeme: "EPSG:3949"
    justification: >-
      Déclaration du 2026-10-05 : toutes les maquettes L18 dont RefLatitude/RefLongitude sont exploitables
      identifient le CC49 (coordonnées partagées Revit) ; les autres portent la position par défaut de Revit
      (Boston, Paris) mais des coordonnées de site dans le domaine du CC49.
  - motif: "L15/**"
    systeme: "EPSG:3949"
    justification: &cc49_lignes >-
      Déclaration de l'utilisateur du 2026-10-07 : toutes les lignes du Grand Paris Express sont en CC49.
      Constat : les 48 maquettes L15 dont le système est identifiable sont en CC49 ; les maquettes non
      positionnées de L15 et L16 ont toutes des coordonnées compatibles avec le seul CC49.
  - motif: "L16/**"
    systeme: "EPSG:3949"
    justification: *cc49_lignes
  - motif: "L17/**"
    systeme: "EPSG:3949"
    justification: *cc49_lignes

# Saisie manuelle (dernier recours, ou prioritaire avec « forcer: true ») : point d'insertion de l'origine du site
# IFC, rotation (degrés, sens trigonométrique, axe X de la maquette par rapport à l'Est), altitude NGF de l'origine.
# Clé facultative pour toute maquette : decalage_vertical_m (ajouté à l'altitude affichée).
maquettes: []
#  - fichier: "L18/Gare/xxx.ifc"
#    x: 646310.0
#    y: 6852080.0
#    systeme: "EPSG:2154"
#    altitude: 155.0
