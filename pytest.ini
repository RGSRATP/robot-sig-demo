[pytest]
testpaths = tests commun/ifc/tests
pythonpath = .
addopts = -q -m "not reseau and not donnees_reelles"
markers =
    reseau: test qui interroge un vrai service à travers le proxy (lancer avec : pytest -m reseau)
    donnees_reelles: recette sur les données internes déjà traitées (lancer avec : pytest -m donnees_reelles -s)
filterwarnings =
    ignore:Using `httpx`
